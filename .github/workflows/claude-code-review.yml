# Reviews every pull request with the agent-skills and ponytail plugins and posts
# the result as a request-changes review, not a comment. A comment is something to
# scroll past; a review is a state the author has to answer.
#
# The other half of this runs in nomadwiz/kaitiki-doc and reads this repository.
# This one reads that one, because the two drift in opposite directions and only
# the direction guarded here is expensive: the documents say what Kaitiaki should
# be, so a change that departs from one is a defect in the change.
#
# The documents are checked out at kaitiki-doc/, not at the parent of this
# repository, although CLAUDE.md links to them as ../doc/... . actions/checkout
# cannot place a repository above the workspace, and checking them out over the
# workspace root would replace the build. The prompt translates the paths instead.
#
# Three jobs, so the model can write nothing on GitHub. claude-review runs the
# model with a read-only token, and the model writes its verdict to a file. post
# runs no model: it checks that file and posts it as a review on this pull
# request only, because the pull request number comes from the event, never from
# the file. merge runs no model and acts on exactly the review post created.
#
# Repository secrets this needs (Settings -> Secrets and variables -> Actions):
#   CLAUDE_CODE_OAUTH_TOKEN    the Claude Code subscription token
#   KAITIAKI_CROSS_REPO_TOKEN  a fine-grained personal access token with
#                              Contents: read on nomadwiz/kaitiaki and
#                              nomadwiz/kaitiki-doc. Both repositories are private,
#                              so the default GITHUB_TOKEN cannot read the other one.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A second push while a review is running cancels the first, so two reviews never
# race onto one pull request.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # A draft is not reviewed. ready_for_review is already a trigger, so nothing
    # is lost: the review runs the moment the draft flag comes off.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # Read-only throughout. Everything in this job after the model starts is
    # treated as untrusted, so nothing here checks the verdict or holds a token
    # that can write: the only thing that leaves is verdict.json.
    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Check out the build
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the reviewer reads history; depth 1 has none

      # The report and the evidence cite commits in this repository, so the
      # documents come with their full history too.
      - name: Check out the documents
        uses: actions/checkout@v4
        with:
          repository: nomadwiz/kaitiki-doc
          ref: master # the documents' default branch is master, not main
          path: kaitiki-doc
          token: ${{ secrets.KAITIAKI_CROSS_REPO_TOKEN }}
          fetch-depth: 0
          # Not stored in .git/config, where the model's Read could open it.
          # Nothing after this runs a git command that needs to authenticate.
          persist-credentials: false

      # The agent-skills plugin's manifest names a github source, and the plugin
      # installer clones that over SSH, which a runner has no key for. Ponytail is
      # unaffected: its manifest declares source "./", so it installs from the
      # marketplace clone already on disk and never fetches again. The rewrite is
      # safe because the clone is anonymous and the repository is public — the
      # extraheader actions/checkout leaves behind is per-repository and does not
      # reach the plugin cache.
      - name: Let the plugin installer clone over HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # The pull request is checked out here, so it could carry a verdict.json of
      # its own. Removed before the model starts, so the file handed on is one
      # the model wrote or nothing at all.
      - name: Remove any verdict the pull request carries
        run: rm -f verdict.json

      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          # Claude acts with this job's read-only token. Without this input the
          # action exchanges for the Claude app's token, which carries
          # contents: write whatever this job declares, and sets it as Claude's
          # GH_TOKEN over any env: given here. That exchange was also where a
          # workflow file differing from main's was refused, so a pull
          # request editing this file now runs its own copy; merge leaves such a
          # pull request for a person. The prompt matches both logins because
          # older reviews are claude[bot]'s; post writes as github-actions[bot].
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/addyosmani/agent-skills.git
            https://github.com/DietrichGebert/ponytail.git
          plugins: |
            agent-skills@addy-agent-skills
            ponytail@ponytail
          claude_args: >-
            --model claude-opus-5-5 --effort high
            --allowedTools "Read,Grep,Glob,Write,Task,Skill,SlashCommand,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(jq:*),Bash(grep:*)"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} of ${{ github.repository }}, the Kaitiaki build: Solidity contracts on Hardhat. The working directory is that repository. The documents repository, nomadwiz/kaitiki-doc, is checked out at `kaitiki-doc/` on its `master` branch with full history.

            ## Read the contract first

            Read `CLAUDE.md` in the working directory, then `kaitiki-doc/CLAUDE.md`, `kaitiki-doc/doc/design/spec.md` and `kaitiki-doc/doc/design/ownership.md`.

            `CLAUDE.md` links to the documents as `../doc/...`, which is where they sit in a working clone. Here they are under `kaitiki-doc/doc/` — so `../doc/design/spec.md` is `kaitiki-doc/doc/design/spec.md`. Translate every such link; none of them is broken for that reason alone. A link whose `#anchor` matches no heading in the target is broken, and worth reporting.

            Enforce what those files say. Do not restate them, do not reinterpret them, and do not apply a rule they do not contain. `CLAUDE.md` holds every rule for this repository; where a rule points at a document for its reason, that document is right about the reason.

            Three things decide most reviews here, so check them on every change:

            - **Scope.** `CLAUDE.md` rule 3: never build what is designed but not built — the `D` rows in section 8 of `kaitiki-doc/doc/design/spec.md`, and everything in its section 10. Building something from either list is the defect to catch first.
            - **The money path.** `CLAUDE.md` rule 1 names every way value could leave other than `Treasury.release` called by the timelock. Rule 2 forbids inventing, rounding or changing a parameter from section 5 of `spec.md`. Rule 5 requires each refusing check to revert with its own named error. Rule 8 forbids a new dependency without an issue. A change that breaks any of these requests changes, however small.
            - **Lanes.** `kaitiki-doc/doc/design/ownership.md` maps each contract to one owner, and each author merges their own pull requests: a change reaching another vertical's contract needs no review from that owner, so never ask for one. Each owner also writes the refusal tests for their own contracts. One lane rule still holds: nobody implements another vertical's contract to unblock themselves; they write against the interface and use a stub. Flag a breach of it.

            ## Earlier rounds

            Every push to this pull request runs this review again. A run that does not know what earlier rounds said finds something new in lines they already passed, and the pull request never converges. So read them first:

            ```
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --paginate --jq '[.[] | select(.user.login == "claude[bot]" or .user.login == "github-actions[bot]") | {id, state, commit_id, submitted_at, body}]'
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate
            ```

            - **None:** this is the first round. Review the whole diff.
            - **Otherwise** the latest one's `commit_id` is the last reviewed commit, and this round does two things and no more. First, under `### Earlier findings` in the body, say for each earlier blocker whether it is fixed, still open, or answered in a reply. Second, review `git diff <last reviewed commit>..${{ github.event.pull_request.head.sha }}` — only what changed since — and run both reviewers over that diff, not the whole pull request.
            - A blocker still open is a blocker of this round too: restate it in `comments` if its line is still in the diff, otherwise in the body.
            - A line an earlier round read and passed is not reopened. Advice an earlier round gave is not reversed unless following it introduced a blocker; where you do reverse one, name the round and say why.
            - Where `git log -1 <last reviewed commit>` fails, the branch was rewritten: review the whole diff as a first round.

            ## Run both reviewers over the diff

            - `/agent-skills:review` for correctness, architecture and security.
            - `/ponytail:ponytail-review` for what can be deleted.

            ## Check the two repositories for drift

            The documents say what Kaitiaki should be. The code says what it is. Report a mismatch, name both sides, and resolve neither — which side moves is the author's decision, not yours. `CLAUDE.md` rule 4 settles the default: a settled decision is not reopened in code, so a change departing from an ADR is raised as an issue, not merged.

            **Here the expensive direction is the change.** A document going stale about correct code is cheap and the documents repository's own reviewer catches it. A change departing from a document that was not updated with it is what this review is for. Where the diff makes a document wrong, say which document and which line.

            **Only a present-tense claim can drift.** A statement inside a dated historical record is correct as written and must not be flagged: a commit message describing what was true then, evidence under `evidence/` captured in a given week, anything under `kaitiki-doc/doc/plan/`, a dated amendment inside an ADR.

            Three checks, cheapest first:

            1. Where the diff adds, removes or renames an event, compare against the ten in section 6 of `kaitiki-doc/doc/design/spec.md`. An event outside that list is drift, and so is one whose fields cannot rebuild the state it changes from the log alone (`CLAUDE.md` rule 6).
            2. Where the diff adds or changes a refusing check, it matches its row in section 7 of `spec.md`: its own named error, and a `.t.sol` test using `vm.expectRevert` with that error. Where it touches a constant or a deployment argument, it matches section 5 of `spec.md` exactly.
            3. Where the diff builds a requirement, check its row in section 8 of `spec.md` and the claim in section 4.1 or 4.2 of `kaitiki-doc/doc/output/report.md`. A requirement now built that a document still calls `D`, or one claimed built that this change removes, needs the document changed — say which.

            ## Write exactly one verdict

            Your token can read but not write, so you post nothing yourself. Write the verdict to `verdict.json` in the working directory and confirm it parses with `jq . verdict.json`. The job after you checks it and posts it to this pull request as one review:

            ```json
            {
              "event": "REQUEST_CHANGES",
              "body": "<the summary>",
              "comments": [
                {"path": "<path>", "line": <line>, "side": "RIGHT", "body": "<the finding>"}
              ]
            }
            ```

            Use `"event": "COMMENT"` with an empty `comments` array when you found nothing. Those two are the only events accepted, `body` must not be empty, and each comment keeps only `path`, `line`, `side` and `body` — anything else in the file is dropped or makes the run fail.

            **Only a blocker blocks.** A blocker is a correctness or security defect, a breach of a rule the files above state, or drift between the repositories. Everything else — wording, a tighter phrasing, an optional cut, most of what `/ponytail:ponytail-review` finds — is a suggestion. A suggestion goes in the body under `### Suggestions`, never in `comments`, and never makes the verdict `REQUEST_CHANGES`. `comments` holds blockers only.

            **A clean verdict merges the pull request.** A `COMMENT` carrying a summary and no inline comments is squash-merged by the merge job that runs after you, without anybody looking at it first. So write one only where you would merge the change yourself, and use `REQUEST_CHANGES` only when at least one finding blocks.

            Every `line` must be one the diff touches, or GitHub rejects the whole review with a 422 and the run fails with nothing posted. `side` is `"RIGHT"` for an added or changed line and `"LEFT"` for a removed one. A finding about a file the diff does not touch goes in the body, not in `comments`.

            **The file is the whole deliverable.** A run that leaves no valid `verdict.json` fails and posts nothing.

            Open the body with one sentence saying whether anything blocks. Then group the findings under `### Correctness`, `### Drift against the documents`, `### Project rules` and `### Suggestions`, leaving out any group that is empty. Quote the rule or the document you measured against, so the author can check your reading. A finding with no file and line is not a finding.

            Report only what you can point at. Where something cannot be determined from this code and those documents, say so and stop. Never pick the most plausible reading and carry on.

      # The verdict leaves this job as a file and nothing else. A run whose model
      # wrote no verdict fails here, and post is skipped, so a silent run cannot
      # look like a clean one.
      - name: Hand the verdict to the next job
        uses: actions/upload-artifact@v7
        with:
          name: verdict
          path: verdict.json
          if-no-files-found: error

  # No model runs here, on a fresh runner. verdict.json is model output, so it is
  # untrusted: the review is rebuilt from the fields this step names, with the
  # commit taken from the event, and anything else in the file is dropped. The
  # pull request is always the event's, so this can post nowhere else.
  post:
    needs: claude-review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # post the review, and dismiss the previous one
    outputs:
      clean: ${{ steps.post.outputs.clean }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: verdict

      # Posted before the dismissal, so a review GitHub rejects (a 422 for a line
      # the diff does not touch) leaves the previous blocker in force rather than
      # leaving the pull request with no verdict at all.
      #
      # A CHANGES_REQUESTED review stays in force across every later push. A
      # COMMENT review does not clear it, and GITHUB_TOKEN is forbidden from
      # APPROVE, which is the one event that would. Without the dismissal the
      # first run that finds a nit blocks the pull request until somebody
      # dismisses it by hand, and the reviewer becomes something people work
      # around. Both logins are matched because older reviews are claude[bot]'s.
      - name: Check the verdict and post it
        id: post
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          jq -e --arg sha "$HEAD_SHA" '
            if (.event == "COMMENT" or .event == "REQUEST_CHANGES")
               and (.body | type == "string" and length > 0)
               and ((.comments // []) | type == "array")
            then {event, body, commit_id: $sha,
                  comments: [(.comments // [])[]
                    | with_entries(select(.key == "path" or .key == "line" or .key == "side" or .key == "body"))]}
            else error("verdict.json is not a COMMENT or REQUEST_CHANGES review with a body")
            end' verdict.json > review.json

          id=$(gh api "repos/$REPO/pulls/$PR/reviews" --input review.json --jq '.id')
          echo "clean=$(jq '.event == "COMMENT" and (.comments | length) == 0' review.json)" >> "$GITHUB_OUTPUT"
          echo "Posted review $id."

          export NEW_ID=$id
          gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '.[] | select((.user.login == "claude[bot]" or .user.login == "github-actions[bot]") and .state == "CHANGES_REQUESTED" and (.id | tostring) != env.NEW_ID) | .id' \
          | while read -r old; do
              gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$old/dismissals" \
                -f message='Superseded by a newer review.' -f event=DISMISS
            done

  # A pull request nothing is blocking does not wait on somebody noticing that
  # nothing is blocking it. needs: means this job is skipped when an earlier one
  # is skipped (a draft) or fails (no valid verdict, or a rejected post).
  #
  # It acts on the one verdict post checked and posted, so no other review
  # counts: not a member's, and not one another run's model might try to place
  # here. Clean means both: that verdict is a plain COMMENT rather than
  # REQUEST_CHANGES, and it carries no inline findings.
  #
  # The merge is deliberately not Claude's. The diff under review is untrusted
  # input, and a model holding the merge button is a model a diff can argue into
  # merging. A diff can still argue the model into a clean verdict on its own
  # pull request, and this job merges on it; that is the only lever left.
  merge:
    needs: post
    runs-on: ubuntu-latest
    permissions:
      contents: write # merge a clean pull request
      pull-requests: read # the changed files and the issues it closes
      issues: write # close those issues: GitHub does not, for this merge

    steps:
      - name: Merge what the review found clean
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLEAN: ${{ needs.post.outputs.clean }}
        run: |
          set -euo pipefail

          if [ "$CLEAN" != true ]; then
            echo "The review requested changes or carries inline findings. Not merging."
            exit 0
          fi

          # A change to any workflow is merged by a person, never here. Such a
          # pull request runs its own copy of this file, so the check only holds
          # while the edit leaves it in — it stops a rules change merging itself
          # because somebody forgot the draft flag, not a hostile one, whose
          # deletion of it would show in its own diff. The file list is read into
          # a variable, because grep -q in a pipe ends early and pipefail would
          # then fail the condition.
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if grep -q '^\.github/workflows/' <<<"$files"; then
            echo "This pull request changes a workflow. Left open for a person to merge."
            exit 0
          fi

          # A branch behind its base was reviewed against something that is no
          # longer what it will become, so it is left for a person. Update branch
          # on the pull request is a person's push, and the review runs again by
          # itself. An update made here would be pushed with github.token, and a
          # push made with github.token does not start this review by itself. The
          # button's default merges the base in; its rebase option rewrites
          # commits already pushed.
          behind=$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq '.behind_by')
          if [ "$behind" -gt 0 ]; then
            echo "Branch is $behind commits behind $BASE. Press Update branch on the pull request (not the rebase option); the review runs again and merges it."
            exit 0
          fi

          # Squashed, so one pull request is one commit on $BASE. GitHub writes a
          # Co-authored-by trailer for every author in the squashed range, so a
          # teammate's commits in the pull request still carry their name. Pinned
          # to the commit that was reviewed: if a push landed since, GitHub
          # refuses the merge and the unreviewed head is not merged.
          if gh api -X PUT "repos/$REPO/pulls/$PR/merge" -f merge_method=squash -f sha="$HEAD_SHA" --silent; then
            echo "Merged #$PR."
          else
            echo "Merge refused. Left open for a person."
            exit 0
          fi

          # Last, so a failure here never costs the merge. GitHub does not close
          # the issues a pull request names when github.token merges it, so this
          # closes them. github.token can write only in this repository, so an
          # issue in the other repository stays for whoever merged to close.
          refs=$(gh pr view "$PR" -R "$REPO" --json closingIssuesReferences \
            --jq '.closingIssuesReferences[] | "\(.repository.owner.login)/\(.repository.name) \(.number)"') \
            || { echo "Could not read the issues #$PR closes. Close them by hand."; refs=""; }
          while read -r repo n; do
            [ -n "$n" ] || continue
            gh issue close "$n" -R "$repo" --comment "Closed by #$PR, merged by the automated review." \
              || echo "Could not close $repo#$n. Close it by hand."
          done <<<"$refs"
